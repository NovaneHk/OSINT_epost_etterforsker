# OSINT B2B Email System - Personas Configuration
# Define target personas for lead generation

personas:
  technical_leaders:
    description: "Technical decision makers and engineering leaders"
    roles:
      - "CTO"
      - "Tech Lead"
      - "VP Engineering"
      - "Head of Technology"
      - "Technical Director"
      - "Chief Technology Officer"
      - "Engineering Manager"
      - "Software Architect"
      - "Dev Lead"
      - "Technology Lead"
    email_patterns:
      - "cto@"
      - "tech@"
      - "engineering@"
      - "dev@"
      - "technical@"
      - "architect@"
      - "devops@"
    negative_signals:
      - "intern"
      - "junior"
      - "assistant"
      - "coordinator"
      - "trainee"
    scoring_weight: 40
    priority_level: "high"

  procurement_specialists:
    description: "Procurement and purchasing decision makers"
    roles:
      - "Procurement Manager"
      - "Purchasing Director"
      - "Supply Chain Manager"
      - "Buyer"
      - "Sourcing Manager"
      - "Head of Procurement"
      - "Chief Procurement Officer"
      - "Vendor Manager"
      - "Supplier Manager"
    email_patterns:
      - "procurement@"
      - "purchasing@"
      - "sourcing@"
      - "buyer@"
      - "supply@"
      - "vendor@"
    negative_signals:
      - "assistant"
      - "clerk"
      - "junior"
      - "coordinator"
    scoring_weight: 35
    priority_level: "high"

  operations_leaders:
