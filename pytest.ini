[pytest]
# OSINT B2B Email System - Pytest Configuration

# Test discovery
testpaths = tests
python_files = test_*.py *_test.py
python_classes = Test*
python_functions = test_*

# Keep the default pytest run focused on the maintained local suite.
norecursedirs =
    tests/functional
    .git
    .next
    node_modules
    __pycache__

# Output configuration
addopts =
    --verbose
    --tb=short
    --strict-markers
    --strict-config
    --cov=core
    --cov=scraping
    --cov=validate
    --cov=scoring
    --cov=monitoring
    --cov-report=html:htmlcov
    --cov-report=term-missing
    --cov-report=xml
    --cov-fail-under=60
    --durations=10

# Markers for test categorization
markers =
    unit: Unit tests for individual components
    integration: Integration tests for workflows
    performance: Performance and load tests
    security: Security vulnerability tests
    compliance: GDPR/ePrivacy compliance tests
    slow: Tests that take more than 5 seconds
    external: Tests that require external services
    database: Tests that require database access
    network: Tests that require network access
    mock: Tests using mocked services

# Test filtering
filterwarnings =
    ignore::UserWarning
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning

# Asyncio default fixture loop scope
asyncio_mode = strict
asyncio_default_fixture_loop_scope = function

# Minimum version requirements
minversion = 6.0

# Logging configuration
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(name)s: %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

# Test timeout (in seconds)
timeout = 300
timeout_method = thread