apiVersion: 1

providers:
  - name: 'OSINT Dashboard'
    orgId: 1
    folder: ''
    type: file
    disableDeletion: false
    editable: true
    options:
      path: /etc/grafana/provisioning/dashboards

datasources:
  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true

dashboards:
  - name: 'System Overview'
    uid: system-overview
    message: 'System metrics dashboard'
    overwrite: true
    config:
      path: /etc/grafana/dashboards/system-overview.json
      
  - name: 'API Metrics'
    uid: api-metrics
    message: 'API performance dashboard'
    overwrite: true
    config:
      path: /etc/grafana/dashboards/api-metrics.json