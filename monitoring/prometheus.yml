global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: 'osint-monitor'

# rule_files:
#   - "alert_rules.yml"   # uncomment when alert_rules.yml is created

# alerting:                # uncomment when alertmanager container is added
#   alertmanagers:
#     - static_configs:
#         - targets:
#           - alertmanager:9093

scrape_configs:
  # Prometheus self-monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # OSINT Backend API
  - job_name: 'osint-backend'
    static_configs:
      - targets: ['backend:8000']
    metrics_path: '/metrics'
    scrape_interval: 30s
    scrape_timeout: 10s

  # OSINT Frontend (Next.js)
  - job_name: 'osint-frontend'
    static_configs:
      - targets: ['frontend:3000']
    metrics_path: '/api/metrics'
    scrape_interval: 30s
    scrape_timeout: 10s

  # --- Optional exporters (add containers to docker-compose.yml to enable) ---
  # - job_name: 'postgres'
  #   static_configs:
  #     - targets: ['postgres-exporter:9187']

  # - job_name: 'redis'
  #   static_configs:
  #     - targets: ['redis-exporter:9121']

  # - job_name: 'node-exporter'
  #   static_configs:
  #     - targets: ['node-exporter:9100']

  # - job_name: 'cadvisor'
  #   static_configs:
  #     - targets: ['cadvisor:8080']

  # - job_name: 'nginx'
  #   static_configs:
  #     - targets: ['nginx-exporter:9113']

  # - job_name: 'blackbox'
  #   metrics_path: /probe
  #   params:
  #     module: [http_2xx]
  #   static_configs:
  #     - targets:
  #       - http://frontend:3000/health
  #       - http://backend:8000/health
  #   relabel_configs:
  #     - source_labels: [__address__]
  #       target_label: __param_target
  #     - source_labels: [__param_target]
  #       target_label: instance
  #     - target_label: __address__
  #       replacement: blackbox-exporter:9115

  # Custom application metrics
  - job_name: 'osint-metrics'
    static_configs:
      - targets: ['backend:8000']
    metrics_path: '/api/metrics/custom'
    scrape_interval: 60s
    honor_labels: true
    params:
      format: ['prometheus']