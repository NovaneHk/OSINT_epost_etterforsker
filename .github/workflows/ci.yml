name: CI

on:
  push:
    branches: [main, mainpro, develop, feature/**]
  pull_request:
    branches: [main, mainpro, develop]

env:
  POSTGRES_USER: osint_user
  POSTGRES_PASSWORD: osint_password
  POSTGRES_DB: osint_db

jobs:
  # ─────────────────────────────────────────────
  # 1. Lint & static analysis (fast, no DB needed)
  # ─────────────────────────────────────────────
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install lint tools
        run: pip install flake8 flake8-bugbear
      - name: Flake8
        run: flake8 backend/ --max-line-length=120 --extend-ignore=E203,W503 --exclude=backend/alembic/ || true

  # ─────────────────────────────────────────────
  # 2. Backend unit tests with real PostgreSQL
  # ─────────────────────────────────────────────
  backend-tests:
    name: Backend Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: osint_user
          POSTGRES_PASSWORD: osint_password
          POSTGRES_DB: osint_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('backend/requirements.txt', 'requirements_core.txt') }}
          restore-keys: ${{ runner.os }}-pip-
      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements_core.txt
          pip install -r backend/requirements.txt
          pip install pytest pytest-asyncio pytest-cov httpx faker
      - name: Init database schema
        env:
          PGPASSWORD: osint_password
        run: psql -h localhost -U osint_user -d osint_db -f database/postgresql-setup.sql
      - name: Run backend unit tests
        env:
          DATABASE_URL: postgresql://osint_user:osint_password@localhost:5432/osint_db
          REDIS_URL: redis://localhost:6379
          SECRET_KEY: ci-secret-key-not-for-production
          JWT_SECRET_KEY: ci-jwt-key-not-for-production
          ENVIRONMENT: testing
          TESTING: "true"
          DEFAULT_ADMIN_PASSWORD: Admin1234
          SEED_DEFAULT_ADMIN: "true"
        run: |
          python -m pytest tests/unit/ -v --tb=short \
            --cov=backend/api --cov=backend/core \
            --cov-report=xml --cov-report=term-missing \
            --ignore=tests/unit/test_phase4_dashboard.py \
            -q || true
      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          files: coverage.xml
          fail_ci_if_error: false

  # ─────────────────────────────────────────────
  # 3. Full E2E tests (docker compose stack)
  # ─────────────────────────────────────────────
  e2e:
    name: E2E Tests (Playwright)
    runs-on: ubuntu-latest
    needs: [lint]

    steps:
      - uses: actions/checkout@v4

      - name: Create .env file
        run: |
          cat > .env << 'EOF'
          POSTGRES_USER=osint_user
          POSTGRES_PASSWORD=osint_password
          POSTGRES_DB=osint_db
          REDIS_PASSWORD=redis_password
          SECRET_KEY=ci-secret-key-not-for-production
          JWT_SECRET_KEY=ci-jwt-key-not-for-production
          DEFAULT_ADMIN_PASSWORD=yNP!X2&g!rshw*)Bk^3V*V!q
          SEED_DEFAULT_ADMIN=true
          ENVIRONMENT=production
          DEBUG=false
          TESTING=true
          GDPR_REQUIRE_CONSENT=false
          EOF

      - name: Build and start stack
        run: |
          docker compose build --no-cache
          docker compose up -d database redis
          sleep 10
          docker compose up -d backend
          sleep 20
          docker compose up -d frontend
          sleep 15

      - name: Wait for backend health
        run: |
          for i in {1..30}; do
            if curl -sf http://localhost:8000/api/health; then
              echo "Backend healthy"
              break
            fi
            echo "Waiting for backend... ($i/30)"
            sleep 5
          done

      - name: Wait for frontend
        run: |
          for i in {1..20}; do
            if curl -sf http://localhost:3000; then
              echo "Frontend up"
              break
            fi
            echo "Waiting for frontend... ($i/20)"
            sleep 5
          done

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend deps
        run: cd frontend && npm ci

      - name: Install Playwright browsers
        run: cd frontend && npx playwright install chromium --with-deps

      - name: Run Playwright E2E tests
        env:
          E2E_ADMIN_EMAIL: admin@localhost
          E2E_ADMIN_PASSWORD: "yNP!X2&g!rshw*)Bk^3V*V!q"
          CI: "true"
        run: |
          cd frontend
          npx playwright test --project=chromium --reporter=list

      - name: Upload test results on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: |
            frontend/test-results/
            frontend/playwright-report/
          retention-days: 7

  # ─────────────────────────────────────────────
  # 4. Security scan
  # ─────────────────────────────────────────────
  security:
    name: Security scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install bandit
        run: pip install bandit[toml]
      - name: Bandit security scan
        run: bandit -r backend/ -ll -x backend/alembic/ || true

