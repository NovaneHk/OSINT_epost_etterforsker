services:
  # PostgreSQL Database
  database:
    image: postgres:15-alpine
    container_name: osint-database
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-osint_db}
      POSTGRES_USER: ${POSTGRES_USER:-osint_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-CHANGE_ME_IN_PRODUCTION}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/postgresql-setup.sql:/docker-entrypoint-initdb.d/01-setup.sql
    ports:
      - "${DB_PORT:-5432}:5432"
    networks:
      - osint-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-osint_user} -d ${POSTGRES_DB:-osint_db}"]
      interval: 30s
      timeout: 10s
      retries: 5
    command: >
      postgres
      -c max_connections=200
      -c shared_buffers=256MB
      -c effective_cache_size=1GB
      -c maintenance_work_mem=64MB
      -c checkpoint_completion_target=0.9
      -c wal_buffers=16MB
      -c default_statistics_target=100

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: osint-redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:-redis_password}
    volumes:
      - redis_data:/data
    ports:
      - "${REDIS_PORT:-6380}:6379"
    networks:
      - osint-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5

  # Backend API
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        - BUILD_ENV=${BUILD_ENV:-production}
    container_name: osint-backend
    restart: unless-stopped
    environment:
      - DATABASE_URL=sqlite:///data/osint_cache.db
      - REDIS_URL=redis://:${REDIS_PASSWORD:-redis_password}@redis:6379
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-your-jwt-secret-key-change-in-production}
      - SECRET_KEY=${SECRET_KEY:-your-secret-key-change-in-production}
      - ENVIRONMENT=${ENVIRONMENT:-production}
      - DEBUG=${DEBUG:-false}
      - HOST=0.0.0.0
      - PORT=8000
      - CORS_ORIGINS=http://frontend:3000,http://localhost:3000,http://127.0.0.1:3000
      - ALLOWED_HOSTS=${ALLOWED_HOSTS:-localhost,127.0.0.1}
      - CREATE_TABLES_ON_STARTUP=true
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - GDPR_REQUIRE_CONSENT=${GDPR_REQUIRE_CONSENT:-false}
      # OSINT tool keys (optional — leave blank to disable)
      - HIBP_API_KEY=${HIBP_API_KEY:-}
      - SPIDERFOOT_URL=${SPIDERFOOT_URL:-}
      - SPIDERFOOT_API_KEY=${SPIDERFOOT_API_KEY:-}
      - INTELOWL_URL=${INTELOWL_URL:-http://localhost:80}
      - INTELOWL_API_KEY=${INTELOWL_API_KEY:-}
      - RECONNG_PATH=${RECONNG_PATH:-}
      # Wave 4 integrations
      - PWNDB_TOR_PROXY=${PWNDB_TOR_PROXY:-socks5h://127.0.0.1:9050}
      - NOVANEXUS_API_URL=${NOVANEXUS_API_URL:-}
      - NOVANEXUS_API_KEY=${NOVANEXUS_API_KEY:-}
      - NOVANEXUS_CAMPAIGN_ID=${NOVANEXUS_CAMPAIGN_ID:-}
      # CRM integrations
      - SALESFORCE_INSTANCE_URL=${SALESFORCE_INSTANCE_URL:-}
      - SALESFORCE_CLIENT_ID=${SALESFORCE_CLIENT_ID:-}
      - SALESFORCE_CLIENT_SECRET=${SALESFORCE_CLIENT_SECRET:-}
      - HUBSPOT_ACCESS_TOKEN=${HUBSPOT_ACCESS_TOKEN:-}
      - M365_TENANT_ID=${M365_TENANT_ID:-}
      - M365_CLIENT_ID=${M365_CLIENT_ID:-}
      - M365_CLIENT_SECRET=${M365_CLIENT_SECRET:-}
      # Automation
      - N8N_WEBHOOK_URL=${N8N_WEBHOOK_URL:-}
      - N8N_API_KEY=${N8N_API_KEY:-}
      # Production docs
      - ENABLE_ADMIN_DOCS=${ENABLE_ADMIN_DOCS:-false}
      - ADMIN_DOCS_TOKEN=${ADMIN_DOCS_TOKEN:-}
    volumes:
      - ./backend/data:/app/data
      - ./logs:/app/logs
      - ./configs:/app/configs
      - ./backend/alembic:/app/alembic
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    networks:
      - osint-network
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s

  # Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - BUILD_ENV=${BUILD_ENV:-production}
    container_name: osint-frontend
    restart: unless-stopped
    environment:
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://backend:8000}
      - NEXT_PUBLIC_APP_URL=${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
      - NEXT_PUBLIC_ENVIRONMENT=${ENVIRONMENT:-production}
      - NEXT_PUBLIC_DEBUG=${DEBUG:-false}
      - NODE_ENV=production
      - NEXT_PUBLIC_APP_NAME=OSINT E-post Etterforsker
      - NEXT_PUBLIC_APP_VERSION=1.0.0
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    networks:
      - osint-network
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: osint-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./nginx/ssl:/etc/nginx/ssl
      - ./nginx/logs:/var/log/nginx
    networks:
      - osint-network
    depends_on:
      - frontend
      - backend
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 5

  # Monitoring - Prometheus
  prometheus:
    image: prom/prometheus:latest
    container_name: osint-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=200h'
      - '--web.enable-lifecycle'
    networks:
      - osint-network

  # Monitoring - Grafana
  grafana:
    image: grafana/grafana:latest
    container_name: osint-grafana
    restart: unless-stopped
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin}
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards
      - ./monitoring/grafana/datasources:/etc/grafana/provisioning/datasources
    networks:
      - osint-network
    depends_on:
      - prometheus

  # Log Management - Loki
  loki:
    image: grafana/loki:latest
    container_name: osint-loki
    restart: unless-stopped
    ports:
      - "3100:3100"
    volumes:
      - ./monitoring/loki.yml:/etc/loki/local-config.yaml
      - loki_data:/loki
    command: -config.file=/etc/loki/local-config.yaml
    networks:
      - osint-network

  # Log Collection - Promtail
  promtail:
    image: grafana/promtail:latest
    container_name: osint-promtail
    restart: unless-stopped
    volumes:
      - ./monitoring/promtail.yml:/etc/promtail/config.yml
      - ./logs:/var/log/osint
      - /var/log:/var/log:ro
    command: -config.file=/etc/promtail/config.yml
    networks:
      - osint-network
    depends_on:
      - loki

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local
  loki_data:
    driver: local

networks:
  osint-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.27.0.0/16